<svg width="390" height="980" viewBox="0 0 390 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="390" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF4E9"/>
      <stop offset="100%" stop-color="#E9F6F2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB38A"/>
      <stop offset="100%" stop-color="#5CC8A1"/>
    </linearGradient>
    <linearGradient id="accentBtn" x1="0" y1="0" x2="350" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB38A"/>
      <stop offset="100%" stop-color="#5CC8A1"/>
    </linearGradient>
    <filter id="soft">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D4A898" flood-opacity="0.18"/>
    </filter>
    <filter id="card">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#C8B0A8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="980" fill="url(#bg)"/>
  <circle cx="340" cy="80" r="70" fill="#FFE0CC" opacity="0.5"/>
  <circle cx="50" cy="190" r="36" fill="#D8F1E8" opacity="0.6"/>

  <!-- ===== HEADER ===== -->
  <g transform="translate(20 24)">
    <text x="0" y="26" font-family="Space Grotesk, sans-serif" font-size="26" font-weight="700" fill="#2B2B2B">Relief</text>
    <text x="0" y="46" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#4D4D4D">肌の記録と食事の傾向をやさしく見える化</text>
    <rect x="0" y="56" width="94" height="26" rx="13" fill="#FFFFFF" stroke="#F0C5AF" stroke-width="1"/>
    <text x="10" y="73" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#7A4B34">セルフケア</text>
    <rect x="104" y="56" width="176" height="26" rx="13" fill="#FFFFFF" stroke="#C7E7DD" stroke-width="1"/>
    <text x="114" y="73" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#2E6A57">医療行為ではありません</text>
  </g>

  <!-- ===== CALENDAR NAV ===== -->
  <g transform="translate(20 112)">
    <rect width="350" height="52" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
    <circle cx="30" cy="26" r="16" fill="#FFF0E6"/>
    <path d="M33 19 L27 26 L33 33" stroke="#7A4B34" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="175" y="22" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="600" fill="#2B2B2B">2024.01.12</text>
    <text x="175" y="38" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#6B6B6B">金曜日</text>
    <circle cx="320" cy="26" r="16" fill="#E6F5EE"/>
    <path d="M317 19 L323 26 L317 33" stroke="#2E6A57" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== COMPACT SNAPSHOT (2 cards) ===== -->
  <g transform="translate(20 180)">
    <g>
      <rect width="168" height="72" rx="16" fill="#FFFFFF" filter="url(#card)"/>
      <text x="14" y="24" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#7A4B34">かゆみ</text>
      <text x="14" y="54" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="700" fill="#2B2B2B">3</text>
      <text x="44" y="54" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#9B9B9B">/10</text>
    </g>
    <g transform="translate(182 0)">
      <rect width="168" height="72" rx="16" fill="#FFFFFF" filter="url(#card)"/>
      <text x="14" y="24" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#2E6A57">水分</text>
      <text x="14" y="54" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700" fill="#2B2B2B">1,600</text>
      <text x="96" y="54" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#9B9B9B">ml</text>
    </g>
  </g>

  <!-- ===== TABS ===== -->
  <g transform="translate(20 268)">
    <rect width="350" height="40" rx="20" fill="#EEDFD8"/>
    <!-- Inactive: 日々の入力 -->
    <text x="87" y="26" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#7A6055">日々の入力</text>
    <!-- Active: 相談チャット -->
    <rect x="178" y="2" width="170" height="36" rx="18" fill="url(#accentBtn)"/>
    <text x="263" y="26" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">相談チャット</text>
  </g>

  <!-- ===== CHAT AREA ===== -->
  <g transform="translate(20 322)">
    <rect width="350" height="544" rx="20" fill="#FFFFFF" filter="url(#card)"/>

    <!-- サジェストチップ -->
    <text x="14" y="26" font-family="Noto Sans JP, sans-serif" font-size="10" fill="#9B9B9B">よく聞かれること</text>
    <rect x="14" y="34" width="126" height="26" rx="13" fill="#FFF0E6" stroke="#FFB38A" stroke-width="1"/>
    <text x="24" y="51" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#7A4B34">かゆみが強い日</text>
    <rect x="150" y="34" width="100" height="26" rx="13" fill="#E6F5EE" stroke="#5CC8A1" stroke-width="1"/>
    <text x="160" y="51" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#2E6A57">睡眠の工夫</text>
    <rect x="260" y="34" width="76" height="26" rx="13" fill="#F0F0FF" stroke="#9999CC" stroke-width="1"/>
    <text x="270" y="51" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#4444AA">食事のヒント</text>

    <!-- ユーザー発言 1 -->
    <rect x="14" y="78" width="210" height="36" rx="18" fill="#F4F4F4"/>
    <text x="26" y="101" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#4D4D4D">かゆみが強い日はどうすれば?</text>

    <!-- AI応答 1 -->
    <rect x="60" y="124" width="276" height="60" rx="18" fill="#FFE6D5"/>
    <text x="76" y="148" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#7A4B34">冷却や室温調整を試しましょう。</text>
    <text x="76" y="166" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#7A4B34">保湿は入浴後すぐに行うのが効果的です。</text>

    <!-- ユーザー発言 2 -->
    <rect x="14" y="200" width="196" height="36" rx="18" fill="#F4F4F4"/>
    <text x="26" y="223" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#4D4D4D">塩分の目安はどれくらい?</text>

    <!-- AI応答 2 -->
    <rect x="60" y="248" width="276" height="60" rx="18" fill="#D5EDEA"/>
    <text x="76" y="272" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#2E6A57">1日の目安は6g程度とされています。</text>
    <text x="76" y="290" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#2E6A57">詳しくは主治医・皮膚科にご相談を。</text>

    <!-- ユーザー発言 3 -->
    <rect x="14" y="322" width="240" height="36" rx="18" fill="#F4F4F4"/>
    <text x="26" y="345" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#4D4D4D">運動はアトピーに効果がありますか?</text>

    <!-- AI応答 3（タイピング中） -->
    <rect x="60" y="370" width="180" height="36" rx="18" fill="#F0F0F0"/>
    <circle cx="82" cy="388" r="5" fill="#AAAAAA"/>
    <circle cx="100" cy="388" r="5" fill="#AAAAAA"/>
    <circle cx="118" cy="388" r="5" fill="#AAAAAA"/>

    <!-- 免責テキスト -->
    <rect x="14" y="418" width="322" height="34" rx="10" fill="#FFF8F4"/>
    <text x="175" y="432" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10" fill="#9B6B5A">※ このチャットは医療行為ではありません。</text>
    <text x="175" y="446" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10" fill="#9B6B5A">症状が重い場合は主治医・皮膚科にご相談ください。</text>

    <!-- チャット入力バー -->
    <rect x="14" y="462" width="270" height="44" rx="22" fill="#F4F4F4"/>
    <text x="30" y="489" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#AAAAAA">相談内容を入力...</text>
    <!-- 送信ボタン -->
    <circle cx="320" cy="484" r="22" fill="url(#accentBtn)"/>
    <path d="M313 477 L327 484 L313 491" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 免責事項フッター -->
  <g transform="translate(20 880)">
    <text x="175" y="14" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10" fill="#AAAAAA">※ 医療行為ではありません。不安な場合は主治医・皮膚科へ</text>
  </g>
</svg>
