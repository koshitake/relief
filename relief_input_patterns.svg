<svg width="390" height="960" viewBox="0 0 390 960" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- iOS Grouped Background -->
  <rect width="390" height="960" fill="#F2F2F7"/>

  <!-- ===== TITLE ===== -->
  <g transform="translate(16 20)">
    <text x="0" y="22" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Input State Patterns</text>
    <text x="0" y="42" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" fill="#8E8E93">各セクションの入力状態パターン</text>
  </g>

  <!-- ==================== PATTERN 1: 未入力 ==================== -->
  <text x="32" y="82" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="600" fill="#8E8E93" letter-spacing="0.2">未入力</text>

  <g transform="translate(16 92)">
    <rect width="358" height="220" rx="14" fill="#FFFFFF"/>

    <!-- State badge -->
    <rect x="16" y="14" width="52" height="22" rx="11" fill="#E5E5EA"/>
    <text x="23" y="29" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#8E8E93">未入力</text>

    <!-- かゆみ部位 -->
    <text x="16" y="58" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#C7C7CC">かゆみ部位</text>
    <rect x="16" y="64" width="326" height="32" rx="9" fill="#F2F2F7"/>
    <text x="28" y="84" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" fill="#C7C7CC">例: ひじ / 首（未入力）</text>

    <!-- かゆみスコア -->
    <text x="16" y="114" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#C7C7CC">かゆみスコア</text>
    <rect x="16" y="120" width="154" height="8" rx="4" fill="#F2F2F7"/>
    <text x="16" y="146" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="22" fill="#D1D1D6">—</text>
    <text x="38" y="146" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" fill="#D1D1D6">/ 10</text>

    <!-- 水分合計 -->
    <text x="188" y="114" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#C7C7CC">水分合計</text>
    <rect x="188" y="120" width="154" height="32" rx="9" fill="#F2F2F7"/>
    <text x="200" y="140" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" fill="#C7C7CC">ml を入力</text>

    <!-- 食事 -->
    <rect x="16" y="164" width="326" height="42" rx="9" fill="#F2F2F7"/>
    <text x="28" y="182" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" fill="#C7C7CC">食事内容 未入力</text>
    <text x="28" y="198" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#D1D1D6">AI推定もありません</text>
  </g>

  <!-- ==================== PATTERN 2: 入力中 ==================== -->
  <text x="32" y="332" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="600" fill="#8E8E93" letter-spacing="0.2">入力中</text>

  <g transform="translate(16 342)">
    <rect width="358" height="248" rx="14" fill="#FFFFFF"/>
    <rect x="0" y="0" width="358" height="4" rx="2" fill="#007AFF"/>

    <!-- State badge -->
    <rect x="16" y="14" width="52" height="22" rx="11" fill="#007AFF15" stroke="#007AFF" stroke-width="0.8"/>
    <text x="23" y="29" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#007AFF">入力中</text>

    <!-- かゆみ部位 (filled) -->
    <text x="16" y="58" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#007AFF">かゆみ部位</text>
    <rect x="16" y="64" width="326" height="32" rx="9" fill="#F2F2F7" stroke="#007AFF" stroke-width="1.2"/>
    <text x="28" y="84" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" fill="#1C1C1E">首・手首</text>

    <!-- かゆみスコア (filled) -->
    <text x="16" y="114" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#007AFF">かゆみスコア</text>
    <rect x="16" y="120" width="154" height="8" rx="4" fill="#F2F2F7"/>
    <rect x="16" y="120" width="92" height="8" rx="4" fill="#007AFF"/>
    <circle cx="108" cy="124" r="9" fill="#FFFFFF" stroke="#007AFF" stroke-width="2"/>
    <text x="16" y="152" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="22" font-weight="700" fill="#1C1C1E">4</text>
    <text x="36" y="152" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" fill="#8E8E93">/ 10</text>

    <!-- 水分合計 (filled) -->
    <text x="188" y="114" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#007AFF">水分合計</text>
    <rect x="188" y="120" width="154" height="32" rx="9" fill="#F2F2F7" stroke="#007AFF" stroke-width="1.2"/>
    <text x="200" y="140" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="15" font-weight="600" fill="#007AFF">1,200</text>
    <text x="254" y="140" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#8E8E93">ml</text>

    <!-- 食事 (入力中) -->
    <rect x="16" y="172" width="326" height="60" rx="9" fill="#F2F2F7"/>
    <text x="28" y="192" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" fill="#1C1C1E">朝: 玄米・味噌汁　昼: そば</text>
    <text x="28" y="208" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#8E8E93">↑ 入力中（まだ推定していません）</text>

    <!-- AI button -->
    <rect x="16" y="210" width="326" height="28" rx="14" fill="#007AFF"/>
    <text x="179" y="229" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">AIで糖質・塩分を推定する</text>
  </g>

  <!-- ==================== PATTERN 3: 推定完了 + 上書き ==================== -->
  <text x="32" y="610" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="600" fill="#8E8E93" letter-spacing="0.2">推定完了・上書き</text>

  <g transform="translate(16 620)">
    <rect width="358" height="316" rx="14" fill="#FFFFFF"/>
    <rect x="0" y="0" width="358" height="4" rx="2" fill="#007AFF"/>

    <!-- State badge -->
    <rect x="16" y="14" width="116" height="22" rx="11" fill="#007AFF15" stroke="#007AFF" stroke-width="0.8"/>
    <text x="26" y="29" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#007AFF">推定完了・上書き可</text>

    <!-- 食事内容 -->
    <text x="16" y="58" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#8E8E93">食事内容</text>
    <text x="16" y="75" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="12" fill="#1C1C1E">朝: 玄米・味噌汁　昼: そば　夜: 鶏むね・野菜炒め</text>

    <!-- 糖質: 推定値 -->
    <text x="16" y="100" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#8E8E93">糖質（AI推定）</text>
    <rect x="16" y="106" width="154" height="40" rx="10" fill="#F2F2F7"/>
    <text x="28" y="126" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#1C1C1E">68 g</text>
    <text x="28" y="140" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="10" fill="#8E8E93">AI推定値</text>

    <!-- 糖質: 上書き -->
    <text x="188" y="100" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#007AFF">上書き値</text>
    <rect x="188" y="106" width="154" height="40" rx="10" fill="#F2F2F7" stroke="#007AFF" stroke-width="1.2"/>
    <text x="200" y="126" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#007AFF">60 g</text>
    <text x="200" y="140" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="10" fill="#007AFF">手動入力</text>

    <!-- 塩分: 推定値 -->
    <text x="16" y="162" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#8E8E93">塩分（AI推定）</text>
    <rect x="16" y="168" width="154" height="40" rx="10" fill="#F2F2F7"/>
    <text x="28" y="188" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#1C1C1E">6.2 g</text>
    <text x="28" y="202" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="10" fill="#8E8E93">AI推定値</text>

    <!-- 塩分: 上書き -->
    <text x="188" y="162" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#007AFF">上書き値</text>
    <rect x="188" y="168" width="154" height="40" rx="10" fill="#F2F2F7" stroke="#007AFF" stroke-width="1.2"/>
    <text x="200" y="188" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="18" font-weight="700" fill="#007AFF">5.5 g</text>
    <text x="200" y="202" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="10" fill="#007AFF">手動入力</text>

    <!-- 根拠 -->
    <rect x="16" y="222" width="326" height="32" rx="9" fill="#F2F2F7"/>
    <text x="28" y="242" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#8E8E93">根拠: 主食と汁物が多いため糖質・塩分ともやや高め</text>

    <!-- アドバイス -->
    <rect x="16" y="264" width="326" height="38" rx="9" fill="#007AFF08"/>
    <text x="28" y="280" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="12" font-weight="600" fill="#007AFF">アドバイス</text>
    <text x="100" y="280" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="12" fill="#3A3A3C">塩分に気をつけて明日は減塩を試みましょう。</text>
  </g>

  <!-- ===== FOOTER ===== -->
  <text x="195" y="950" text-anchor="middle" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="11" fill="#AEAEB2">※ 医療行為ではありません。不安な場合は主治医・皮膚科へ</text>

</svg>
