<svg width="390" height="920" viewBox="0 0 390 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="390" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF4E9"/>
      <stop offset="100%" stop-color="#E9F6F2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="350" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB38A"/>
      <stop offset="100%" stop-color="#5CC8A1"/>
    </linearGradient>
    <filter id="card">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#C8B0A8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="390" height="920" fill="url(#bg)"/>

  <!-- Title -->
  <g transform="translate(20 20)">
    <text x="0" y="22" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#2B2B2B">Input State Patterns</text>
    <text x="0" y="42" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#6B6B6B">各セクションの入力状態パターン</text>
  </g>

  <!-- ==================== PATTERN 1: 未入力 ==================== -->
  <g transform="translate(20 70)">
    <rect width="350" height="238" rx="18" fill="#FFFFFF" filter="url(#card)"/>

    <!-- ラベル -->
    <rect x="14" y="14" width="58" height="22" rx="11" fill="#F4F4F4"/>
    <text x="22" y="29" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#8A8A8A">未入力</text>

    <!-- かゆみ部位 -->
    <text x="14" y="60" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#CCCCCC">かゆみ部位</text>
    <rect x="14" y="66" width="322" height="32" rx="10" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1"/>
    <text x="26" y="87" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#CCCCCC">例: ひじ / 首（未入力）</text>

    <!-- かゆみスコア | 水分 -->
    <text x="14" y="118" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#CCCCCC">かゆみスコア</text>
    <rect x="14" y="124" width="154" height="10" rx="5" fill="#F4F4F4"/>
    <text x="14" y="148" font-family="Noto Sans JP, sans-serif" font-size="13" fill="#CCCCCC">—</text>
    <text x="32" y="148" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#CCCCCC">/ 10</text>

    <text x="182" y="118" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#CCCCCC">水分合計</text>
    <rect x="182" y="124" width="154" height="32" rx="10" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1"/>
    <text x="194" y="145" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#CCCCCC">ml を入力</text>

    <!-- メモ | 運動 -->
    <rect x="14" y="166" width="130" height="22" rx="11" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1"/>
    <text x="24" y="181" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#CCCCCC">メモ 未入力</text>
    <rect x="154" y="166" width="182" height="22" rx="11" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1"/>
    <text x="164" y="181" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#CCCCCC">運動 未入力</text>

    <!-- 食事 -->
    <rect x="14" y="200" width="322" height="26" rx="10" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1"/>
    <text x="26" y="217" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#CCCCCC">食事内容 未入力（推定もなし）</text>
  </g>

  <!-- ==================== PATTERN 2: 入力中 ==================== -->
  <g transform="translate(20 328)">
    <rect width="350" height="252" rx="18" fill="#FFFFFF" filter="url(#card)"/>

    <!-- ラベル -->
    <rect x="14" y="14" width="68" height="22" rx="11" fill="#FFE6D5"/>
    <text x="22" y="29" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#7A4B34">入力中</text>

    <!-- かゆみ部位 (入力済) -->
    <text x="14" y="60" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#7A4B34">かゆみ部位</text>
    <rect x="14" y="66" width="322" height="32" rx="10" fill="#FFF1E6" stroke="#FFB38A" stroke-width="1.5"/>
    <text x="26" y="87" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#5A3020">首・手首</text>

    <!-- かゆみスコア(入力済) | 水分(入力済) -->
    <text x="14" y="118" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#7A4B34">かゆみスコア</text>
    <rect x="14" y="124" width="154" height="10" rx="5" fill="#FFE6D5"/>
    <rect x="14" y="124" width="90" height="10" rx="5" fill="url(#accent)"/>
    <circle cx="104" cy="129" r="8" fill="#FFFFFF" stroke="#FFB38A" stroke-width="2"/>
    <text x="14" y="152" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#2B2B2B">4</text>
    <text x="34" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#9B9B9B">/ 10</text>

    <text x="182" y="118" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#2E6A57">水分合計</text>
    <rect x="182" y="124" width="154" height="32" rx="10" fill="#E5F5F0" stroke="#5CC8A1" stroke-width="1.5"/>
    <text x="194" y="145" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#2E6A57">1,200</text>
    <text x="252" y="145" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#6B9E8E">ml</text>

    <!-- メモ | 運動 -->
    <rect x="14" y="172" width="130" height="22" rx="11" fill="#FFF1E6" stroke="#FFB38A" stroke-width="1"/>
    <text x="24" y="187" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#7A4B34">乾燥が気になる</text>
    <rect x="154" y="172" width="182" height="22" rx="11" fill="#E5F5F0" stroke="#5CC8A1" stroke-width="1"/>
    <text x="164" y="187" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#2E6A57">ウォーキング30分</text>

    <!-- 食事（入力中・未推定） -->
    <rect x="14" y="206" width="322" height="32" rx="10" fill="#FAFAFA"/>
    <text x="26" y="220" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#4D4D4D">朝: 玄米・味噌汁  昼: そば</text>
    <text x="26" y="232" font-family="Noto Sans JP, sans-serif" font-size="10" fill="#BBBBBB">↑ 入力中（まだ推定していません）</text>
  </g>

  <!-- ==================== PATTERN 3: 推定完了 + 上書き ==================== -->
  <g transform="translate(20 600)">
    <rect width="350" height="288" rx="18" fill="#FFFFFF" filter="url(#card)"/>

    <!-- ラベル -->
    <rect x="14" y="14" width="116" height="22" rx="11" fill="#D8F0E8"/>
    <text x="22" y="29" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#2E6A57">推定完了 + 上書き</text>

    <!-- 食事内容（確定） -->
    <text x="14" y="58" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#4D4D4D">食事内容</text>
    <text x="14" y="76" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#2B2B2B">朝: 玄米・味噌汁　昼: そば　夜: 鶏むね・野菜炒め</text>

    <!-- 糖質 推定値 + 上書き -->
    <text x="14" y="100" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#7A4B34">糖質（推定）</text>
    <rect x="14" y="106" width="150" height="32" rx="10" fill="#FFF0E6"/>
    <text x="26" y="127" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#7A4B34">68 g</text>
    <text x="100" y="127" font-family="Noto Sans JP, sans-serif" font-size="10" fill="#AAAAAA">AI推定値</text>

    <text x="182" y="100" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#7A4B34">上書き値</text>
    <rect x="182" y="106" width="154" height="32" rx="10" fill="#FFF1E6" stroke="#FFB38A" stroke-width="1.5"/>
    <text x="194" y="127" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#5A3020">60 g</text>
    <text x="236" y="127" font-family="Noto Sans JP, sans-serif" font-size="10" fill="#7A4B34">（手動入力）</text>

    <!-- 塩分 推定値 + 上書き -->
    <text x="14" y="158" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#2E6A57">塩分（推定）</text>
    <rect x="14" y="164" width="150" height="32" rx="10" fill="#E6F5EE"/>
    <text x="26" y="185" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#2E6A57">6.2 g</text>
    <text x="80" y="185" font-family="Noto Sans JP, sans-serif" font-size="10" fill="#AAAAAA">AI推定値</text>

    <text x="182" y="158" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#2E6A57">上書き値</text>
    <rect x="182" y="164" width="154" height="32" rx="10" fill="#DDF0E8" stroke="#5CC8A1" stroke-width="1.5"/>
    <text x="194" y="185" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#1D5A46">5.5 g</text>
    <text x="236" y="185" font-family="Noto Sans JP, sans-serif" font-size="10" fill="#2E6A57">（手動入力）</text>

    <!-- 推定根拠 -->
    <rect x="14" y="210" width="322" height="28" rx="10" fill="#F4F4F4"/>
    <text x="24" y="228" font-family="Noto Sans JP, sans-serif" font-size="10" fill="#6B6B6B">根拠: 主食と汁物が多いため糖質・塩分ともやや高め</text>

    <!-- 日次アドバイス -->
    <rect x="14" y="250" width="322" height="28" rx="10" fill="#FFF8F4"/>
    <text x="24" y="264" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#7A4B34">アドバイス</text>
    <text x="90" y="264" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#4D4D4D">塩分に気をつけて、明日は減塩を試みましょう。</text>
  </g>
</svg>
